[project]
name = "go2-service"
version = "0.1.0"
description = "Service intermédiaire GO2 Scratch : frontend Blockly <-> robot Unitree Go2"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# Dépendance OPTIONNELLE et non installée par défaut.
# Le SDK Unitree exige Linux + CycloneDDS et n'est pas installable sur
# Windows. Voir docs/ROBOT_SETUP.md.
#   pip install git+https://github.com/unitreerobotics/unitree_sdk2_python.git
unitree = []

[project.scripts]
go2-service = "go2_service.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:go2_service.*"]