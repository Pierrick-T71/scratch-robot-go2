# Upstream vers le service FastAPI (robot-service)
upstream robot_backend {
    server 127.0.0.1:8765;
}

server {
    listen 80;
    listen [::]:80;
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /var/lib/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Interface Web (SPA Svelte / Blockly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache des ressources statiques
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy pour l'API REST
    location /api/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Proxy pour le WebSocket des événements en direct
    location /ws/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
